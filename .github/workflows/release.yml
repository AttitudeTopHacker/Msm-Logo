name: Build and Release .deb

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 plymouth

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow pytest

      - name: Run Test Suite
        run: |
          pytest -v

  build-deb:
    name: Build Debian Package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Build .deb Package
        run: |
          chmod +x build_deb.sh build_deb.py
          ./build_deb.sh

      - name: Verify Package Contents
        run: |
          dpkg-deb -I dist/msmlogo_*.deb
          dpkg-deb -c dist/msmlogo_*.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msmlogo-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
