<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Card Frame -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Inner Glow Ring & Power Symbol -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="160" fill="none" stroke="#1e1b4b" stroke-width="24" opacity="0.6" />
    <!-- Arc for Power Ring -->
    <path d="M 160 160 A 136 136 0 1 0 352 160" fill="none" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round" />
    <!-- Vertical Power Line -->
    <line x1="256" y1="100" x2="256" y2="230" stroke="url(#neonGrad)" stroke-width="24" stroke-linecap="round" />
  </g>
  
  <!-- Modern Shimmer Dots -->
  <circle cx="256" cy="390" r="8" fill="#38bdf8" />
  <circle cx="216" cy="390" r="5" fill="#818cf8" opacity="0.7" />
  <circle cx="296" cy="390" r="5" fill="#c084fc" opacity="0.7" />
</svg>
